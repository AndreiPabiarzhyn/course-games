<svg xmlns="http://www.w3.org/2000/svg" width="64" height="120" viewBox="0 0 64 120">
  <defs>
    <radialGradient id="m1-body" cx="32%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#bcaaa4"/>
      <stop offset="40%" stop-color="#795548"/>
      <stop offset="100%" stop-color="#3e2723"/>
    </radialGradient>
    <radialGradient id="m1-pit" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#1b0f0a"/>
      <stop offset="100%" stop-color="#5d4037" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="m1-tail" x1="32" y1="0" x2="32" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fffde7"/>
      <stop offset="18%" stop-color="#ffee58"/>
      <stop offset="45%" stop-color="#ff9100"/>
      <stop offset="75%" stop-color="#e65100" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#bf360c" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="m1-core" x1="32" y1="2" x2="32" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#ffd54f"/>
      <stop offset="100%" stop-color="#ff6f00" stop-opacity="0"/>
    </linearGradient>
    <filter id="m1-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
  </defs>

  <!-- long comet tail -->
  <g opacity="0.95">
    <path d="M32 0 C26 18, 20 32, 18 44 C22 36, 26 24, 32 14 C38 24, 42 36, 46 44 C44 32, 38 18, 32 0Z" fill="url(#m1-tail)" filter="url(#m1-blur)"/>
    <path d="M32 2 C28 16, 24 28, 22 38 C24 30, 28 20, 32 12 C36 20, 40 30, 42 38 C40 28, 36 16, 32 2Z" fill="url(#m1-core)"/>
    <path d="M32 8 L30 28 L34 28 Z" fill="#fff9c4" opacity="0.85"/>
    <!-- sparks -->
    <circle cx="22" cy="20" r="1.1" fill="#fff59d"/>
    <circle cx="42" cy="26" r="0.9" fill="#ffe082"/>
    <circle cx="28" cy="34" r="0.7" fill="#ffcc80" opacity="0.8"/>
    <circle cx="38" cy="14" r="0.8" fill="#fff8e1"/>
  </g>

  <!-- jagged rock -->
  <path d="M32 46
    L44 48 L52 58 L50 72 L42 84 L30 90 L18 84 L10 70 L12 56 L20 48 Z"
    fill="url(#m1-body)" stroke="#2d1f1a" stroke-width="2" stroke-linejoin="round"/>

  <path d="M20 48 L32 52 L44 48" fill="none" stroke="#6d4c41" stroke-width="1.2" opacity="0.5"/>
  <path d="M12 56 L32 62 L50 72" fill="none" stroke="#5d4037" stroke-width="1" opacity="0.4"/>

  <ellipse cx="22" cy="66" rx="5" ry="4" fill="url(#m1-pit)"/>
  <ellipse cx="38" cy="62" rx="4" ry="3.5" fill="url(#m1-pit)"/>
  <circle cx="44" cy="74" r="2.8" fill="url(#m1-pit)"/>
  <ellipse cx="28" cy="78" rx="3.5" ry="2.5" fill="url(#m1-pit)"/>

  <path d="M16 54 L20 48 L18 58 Z" fill="#d7ccc8" opacity="0.4"/>
  <ellipse cx="32" cy="50" rx="8" ry="2" fill="#ff8f00" opacity="0.35"/>
</svg>
