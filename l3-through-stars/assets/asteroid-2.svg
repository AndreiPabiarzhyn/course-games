<svg xmlns="http://www.w3.org/2000/svg" width="64" height="120" viewBox="0 0 64 120">
  <defs>
    <radialGradient id="m2-body" cx="38%" cy="38%" r="68%">
      <stop offset="0%" stop-color="#b0bec5"/>
      <stop offset="45%" stop-color="#607d8b"/>
      <stop offset="100%" stop-color="#263238"/>
    </radialGradient>
    <radialGradient id="m2-pit" cx="50%" cy="55%" r="50%">
      <stop offset="0%" stop-color="#0d1619"/>
      <stop offset="100%" stop-color="#455a64" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="m2-tail" x1="32" y1="0" x2="32" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fff3e0"/>
      <stop offset="20%" stop-color="#ffab91"/>
      <stop offset="50%" stop-color="#ff5722"/>
      <stop offset="80%" stop-color="#d84315" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#bf360c" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="m2-core" x1="32" y1="0" x2="32" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#ffccbc"/>
      <stop offset="100%" stop-color="#ff7043" stop-opacity="0"/>
    </linearGradient>
    <filter id="m2-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.8"/>
    </filter>
  </defs>

  <!-- crimson comet tail -->
  <g opacity="0.95">
    <path d="M32 0 C24 16, 18 30, 16 42 C20 34, 24 22, 32 12 C40 22, 44 34, 48 42 C46 30, 40 16, 32 0Z" fill="url(#m2-tail)" filter="url(#m2-blur)"/>
    <path d="M32 2 C26 14, 22 26, 20 36 C22 28, 26 18, 32 10 C38 18, 42 28, 44 36 C42 26, 38 14, 32 2Z" fill="url(#m2-core)"/>
    <circle cx="24" cy="18" r="1" fill="#ffe0b2"/>
    <circle cx="40" cy="24" r="1.1" fill="#ffccbc"/>
    <circle cx="30" cy="32" r="0.7" fill="#ffab91" opacity="0.85"/>
  </g>

  <!-- sharp crystal rock -->
  <path d="M32 44
    L48 50 L54 64 L48 82 L34 92 L16 86 L8 68 L14 50 L26 44 Z"
    fill="url(#m2-body)" stroke="#1a2327" stroke-width="2" stroke-linejoin="round"/>

  <path d="M14 50 L32 56 L48 50" fill="none" stroke="#78909c" stroke-width="1.2" opacity="0.55"/>
  <path d="M8 68 L32 60 L54 64" fill="none" stroke="#546e7a" stroke-width="1" opacity="0.45"/>
  <path d="M32 56 L34 92" fill="none" stroke="#607d8b" stroke-width="1" opacity="0.35"/>
  <path d="M32 56 L16 86" fill="none" stroke="#455a64" stroke-width="1" opacity="0.35"/>

  <ellipse cx="20" cy="64" rx="5" ry="4" fill="url(#m2-pit)"/>
  <ellipse cx="40" cy="70" rx="4.5" ry="3.5" fill="url(#m2-pit)"/>
  <circle cx="46" cy="58" r="3" fill="url(#m2-pit)"/>

  <path d="M12 58 L14 50 L18 60 Z" fill="#cfd8dc" opacity="0.4"/>
  <ellipse cx="32" cy="48" rx="7" ry="2" fill="#ff5722" opacity="0.32"/>
</svg>
